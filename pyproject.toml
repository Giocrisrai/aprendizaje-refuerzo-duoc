[project]
name = "aprendizaje-refuerzo-duoc"
version = "2026.2.0"
description = "Clases de aprendizaje por refuerzo, Duoc UC Puerto Montt"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "gymnasium>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbclient>=0.10",
]

[tool.uv]
package = false
